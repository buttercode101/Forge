<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Forge — evidence-first SaaS opportunity intelligence"><title>Forge</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#111;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:850;font-size:21px}.brand span{color:#777}.nav{display:grid;gap:5px;margin-top:30px}.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:11px;border-radius:8px}.nav button.active,.nav button:hover{background:#242424;color:#fff}.side-note{position:absolute;bottom:20px;color:#777;font-size:11px;line-height:1.5;right:18px;left:18px}main{max-width:1300px;width:100%;padding:38px 42px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#888;font-weight:700}.title{font-size:34px;letter-spacing:-.05em;margin:5px 0 28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.table{background:#fff;border:1px solid #e3e3df;border-radius:13px}.card{padding:18px}.metric{font-size:30px;font-weight:850;margin-top:7px}.label{font-size:11px;color:#777;font-weight:750}.section{margin-top:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h2{font-size:17px;margin:0}.table{overflow:hidden}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:14px;padding:15px 17px;border-top:1px solid #eee;align-items:center}.row:first-child{border-top:0}.head{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#888;background:#fafafa}.btn{border:1px solid #d8d8d4;background:#fff;padding:9px 13px;border-radius:8px;font-weight:750}.btn.primary{background:#111;color:#fff;border-color:#111}.pill{display:inline-flex;padding:5px 8px;border-radius:99px;background:#eee;font-size:10px;font-weight:750}.green{background:#e5f3e9;color:#17612e}.amber{background:#f8efd7;color:#795b10}.red{background:#f8e5e5;color:#8a2424}.empty{text-align:center;padding:40px;color:#777}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;font-weight:800}.field input,.field textarea,.field select{border:1px solid #d8d8d4;border-radius:8px;background:#fff;padding:10px 11px;width:100%}.field textarea{min-height:105px}.actions{display:flex;gap:8px;margin:16px 0}.form{max-width:760px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.item{border:1px solid #eee;border-radius:8px;padding:10px;font-size:12px;margin:8px 0}.muted{color:#777}.score{font-size:42px;font-weight:850}.barline{display:grid;grid-template-columns:105px 1fr 38px;gap:8px;align-items:center;font-size:11px;margin:10px 0}.bar{height:7px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#111}.notice{padding:11px;background:#f1f1ee;border-radius:8px;font-size:12px;line-height:1.5}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;display:flex;align-items:center;gap:20px;padding:13px}.nav{display:flex;margin:0;overflow:auto}.side-note{display:none}main{padding:25px 18px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.row{grid-template-columns:1.7fr 1fr auto}.row>:nth-child(3),.row>:nth-child(4){display:none}}@media(max-width:560px){.title{font-size:28px}.row{grid-template-columns:1fr auto}.row>:nth-child(2){display:none}}</style></head><body><div id="app"></div><script>
const KEY="forge.web.v1",stages=["captured","researched","challenged","validation","validated","rejected","building","verified"],kinds=["revenue","pricing","customer","marketplace","usage","complaint","competitor","local-gap","first-party","internal","community"];let state=load(),view="dashboard",selected=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===1?x:{version:1,opportunities:[]}}catch(e){return{version:1,opportunities:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(x){return String(x||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function assess(o){let ev=o.evidence||[],com=ev.filter(e=>["revenue","pricing","customer"].includes(e.kind)),pain=ev.filter(e=>e.kind==="complaint"),local=ev.filter(e=>e.kind==="local-gap"),comp=ev.filter(e=>e.kind==="competitor"),v=o.validation;let proof=avg(com.map(e=>e.confidence)),coverage=avg(ev.map(e=>e.confidence)),p=avg(pain.map(e=>e.confidence)),lg=avg(local.map(e=>e.confidence)),context=Math.min(1,(o.customer?0.5:0)+(o.category?0.25:0)+(o.geography?0.25:0)),validation=Math.min(1,v.customerConversations/5)*.3+Math.min(1,v.waitlistSignups/50)*.15+Math.min(1,v.trials/10)*.15+Math.min(1,v.paidCustomers/3)*.25+Math.min(1,v.paymentEvidence/3)*.15,risks=[];if(!o.customer)risks.push("Customer segment is undefined.");if(!o.problem)risks.push("Problem statement is undefined.");if(!o.existingSolutions.length&&!comp.length)risks.push("No category or substitute evidence.");if(!o.differentiators.length&&!local.length)risks.push("No differentiated wedge is documented.");if(!com.length)risks.push("No commercial evidence is recorded.");return{proof,coverage,p,lg,context,validation,risks,decision:coverage<.15?"RESEARCH":proof===0||validation<.25?"CHALLENGE":"VALIDATE"}}
function nav(){return "<aside class=side><div class=brand>FORGE <span>/ foundry</span></div><nav class=nav><button class="+(view==="dashboard"?"active":"")+" onclick=\"setView('dashboard')\">Overview</button><button class="+(view==="opportunities"?"active":"")+" onclick=\"setView('opportunities')\">Opportunities</button><button class="+(view==="new"?"active":"")+" onclick=\"setView('new')\">Capture idea</button></nav><div class=side-note>Evidence-first opportunity intelligence.<br>Local persistence. No fabricated proof.</div></aside>"}
function layout(body,title,sub){return "<div class=shell>"+nav()+"<main><div class=eyebrow>Forge</div><div class=title>"+title+"</div><div class=muted style=\"margin-top:-22px;margin-bottom:25px\">"+sub+"</div>"+body+"</main></div>"}
function rows(os){if(!os.length)return "<div class=empty>No opportunities yet. Start with a problem that already has evidence.</div>";return os.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(o=>{let a=assess(o);return "<div class=row><div><b>"+esc(o.title)+"</b><div class=muted>"+esc(o.customer)+"</div></div><div><span class=pill>"+o.stage+"</span></div><div>"+o.evidence.length+"</div><div><span class=\"pill "+(a.decision==="VALIDATE"?"green":a.decision==="CHALLENGE"?"amber":"red")+"\">"+a.decision+"</span></div><div><button class=btn onclick=\"openOpp('"+o.id+"')\">Open</button></div></div>"}).join("")}
function dashboard(){let os=state.opportunities;return layout("<div class=grid><div class=card><div class=label>OPPORTUNITIES</div><div class=metric>"+os.length+"</div></div><div class=card><div class=label>COMMERCIAL PROOF</div><div class=metric>"+os.filter(o=>o.evidence.some(e=>["revenue","pricing","customer"].includes(e.kind))).length+"</div></div><div class=card><div class=label>VALIDATED</div><div class=metric>"+os.filter(o=>o.stage==="validated").length+"</div></div><div class=card><div class=label>VERIFIED</div><div class=metric>"+os.filter(o=>o.stage==="verified").length+"</div></div></div><section class=section><div class=section-head><h2>Pipeline</h2><button class=\"btn primary\" onclick=\"setView('new')\">Capture opportunity</button></div><div class=table><div class=\"row head\"><div>Opportunity</div><div>Stage</div><div>Evidence</div><div>Decision</div><div></div></div>"+rows(os)+"</div></section>","Opportunity Foundry","Evidence before execution")}
function opportunities(){return layout("<div class=section-head><h2>All opportunities</h2><button class=\"btn primary\" onclick=\"setView('new')\">Capture idea</button></div><div class=table><div class=\"row head\"><div>Opportunity</div><div>Stage</div><div>Evidence</div><div>Decision</div><div></div></div>"+rows(state.opportunities)+"</div>","Opportunities","Your evidence-backed idea pipeline")}
function newView(){return layout("<div class=\"card form\"><div class=notice>Capture context first. Forge keeps proof, validation and decisions attached to the opportunity.</div><form onsubmit=createOpp(event)><div class=field><label>Title</label><input name=title required placeholder=\"Opportunity name\"></div><div class=field><label>Problem</label><textarea name=problem required placeholder=\"What painful, expensive or repeated problem exists?\"></textarea></div><div class=field><label>Customer</label><input name=customer required placeholder=\"Who pays or experiences it?\"></div><div class=field><label>Category</label><input name=category placeholder=Category></div><div class=field><label>Geography</label><input name=geography placeholder=\"Market or country\"></div><div class=field><label>Existing solutions</label><input name=solutions placeholder=\"Comma-separated competitors/substitutes\"></div><div class=field><label>Differentiator</label><input name=diff placeholder=\"Initial wedge\"></div><div class=actions><button class=\"btn primary\">Create opportunity</button><button type=button class=btn onclick=\"setView('dashboard')\">Cancel</button></div></form></div>","Capture opportunity","Build the evidence record before you build the product")}
function detail(o){let a=assess(o),bars=[["Commercial proof",a.proof],["Context",a.context],["Validation",a.validation],["Pain",a.p]];return layout("<div class=actions><button class=btn onclick=\"setView('opportunities')\">← Back</button><button class=btn onclick=removeOpp()>Delete</button></div><div class=split><div><div class=card><div class=eyebrow>"+esc(o.category||"uncategorised")+" · "+esc(o.geography||"global")+"</div><h2>"+esc(o.title)+"</h2><p>"+esc(o.problem)+"</p><div class=muted>Customer: "+esc(o.customer)+"</div><div class=field><label>Stage</label><select onchange=changeStage(this.value)>"+stages.map(s=>"<option "+(s===o.stage?"selected":"")+">"+s+"</option>").join("")+"</select></div></div><div class=\"card section\"><div class=section-head><h2>Evidence</h2></div>"+(o.evidence.map(e=>"<div class=item><b>"+e.kind+"</b> · "+e.state+" · "+Math.round(e.confidence*100)+"%<br>"+esc(e.claim)+"<br><span class=muted>"+esc(e.source)+"</span></div>").join("")||"<div class=empty>No evidence yet.</div>")+"<form onsubmit=addEvidence(event)><div class=field><label>Type</label><select name=kind>"+kinds.map(k=>"<option>"+k+"</option>").join("")+"</select></div><div class=field><label>Claim</label><input name=claim required></div><div class=field><label>Source</label><input name=source required></div><div class=field><label>Confidence</label><input name=confidence type=number min=0 max=1 step=.05 value=.8></div><button class=\"btn primary\">Add evidence</button></form></div></div><div><div class=card><div class=label>DECISION</div><div class=metric>"+a.decision+"</div><p class=muted>"+(a.risks[0]||"Core evidence gates are currently satisfied.")+"</p></div><div class=\"card section\"><div class=label>EVIDENCE SCORE</div><div class=score>"+Math.round(a.coverage*100)+"%</div>"+bars.map(x=>"<div class=barline><span>"+x[0]+"</span><div class=bar><i style=\"width:"+Math.round(x[1]*100)+"%\"></i></div><b>"+Math.round(x[1]*100)+"%</b></div>").join("")+"</div><div class=\"card section\"><div class=label>VALIDATION</div>"+Object.keys(o.validation).map(k=>"<div class=field><label>"+k+"</label><input type=number min=0 value="+o.validation[k]+" onchange=\"setVal('"+k+"',this.value)\"></div>").join("")+"</div></div></div>","Opportunity dossier","Evidence-first assessment and validation gates")}
function setView(v){view=v;selected=null;render()}function openOpp(id){selected=id;render()}function current(){return state.opportunities.find(o=>o.id===selected)}
function createOpp(e){e.preventDefault();let f=new FormData(e.target),now=new Date().toISOString(),o={id:crypto.randomUUID(),title:String(f.get("title")).trim(),problem:String(f.get("problem")).trim(),customer:String(f.get("customer")).trim(),category:String(f.get("category")||"").trim(),geography:String(f.get("geography")||"").trim(),existingSolutions:String(f.get("solutions")||"").split(",").map(x=>x.trim()).filter(Boolean),differentiators:[String(f.get("diff")||"").trim()].filter(Boolean),evidence:[],stage:"captured",createdAt:now,updatedAt:now,validation:{customerConversations:0,waitlistSignups:0,trials:0,paidCustomers:0,paymentEvidence:0}};state.opportunities.push(o);selected=o.id;save()}
function addEvidence(e){e.preventDefault();let o=current(),f=new FormData(e.target);o.evidence.push({id:crypto.randomUUID(),kind:f.get("kind"),state:"CLAIMED",claim:String(f.get("claim")).trim(),source:String(f.get("source")).trim(),observedAt:new Date().toISOString(),confidence:Math.max(0,Math.min(1,Number(f.get("confidence"))||0))});o.updatedAt=new Date().toISOString();save()}
function changeStage(v){let o=current();if(v==="validated"&&assess(o).validation<.25){alert("Validation gate failed: collect stronger validation evidence first.");render();return}o.stage=v;o.updatedAt=new Date().toISOString();save()}
function setVal(k,v){let o=current();o.validation[k]=Math.max(0,Math.floor(Number(v)||0));o.updatedAt=new Date().toISOString();save()}
function removeOpp(){if(!confirm("Delete this opportunity and local evidence?"))return;state.opportunities=state.opportunities.filter(o=>o.id!==selected);selected=null;setView("opportunities")}
window.setView=setView;window.openOpp=openOpp;window.createOpp=createOpp;window.addEvidence=addEvidence;window.changeStage=changeStage;window.setVal=setVal;window.removeOpp=removeOpp;render();
function render(){let body=selected&&current()?detail(current()):view==="opportunities"?opportunities():view==="new"?newView():dashboard();document.getElementById("app").innerHTML=body}
</script></body></html>
