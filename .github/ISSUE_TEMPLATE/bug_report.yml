name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove secrets and private evidence before submitting."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Include relevant commands, tests, logs or screenshots.
