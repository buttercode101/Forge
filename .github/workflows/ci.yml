name: Forge CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build and full test suite
        run: npm run check
      - name: Release verification
        run: npm run verify:release > forge-verification.json
      - name: Standalone proof verification
        run: node tools/verify-proof.mjs forge-verification.json
      - name: Upload verification proof
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-verification
          path: forge-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Web contract verification
        run: npm run verify:web
      - name: Diff hygiene
        run: git diff --check
      - name: Package smoke
        run: npm pack --dry-run
